services:
  - type: web
    name: citytech-cloud-server
    rootDir: CityTech-Cloud-Server-Deploy
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: citytech-db
          property: connectionString

databases:
  - name: citytech-db
    plan: free
